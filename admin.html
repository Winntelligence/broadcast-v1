<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winntelligence — Admin Console</title>
<style>
  :root{
    --bg:#0a0e13; --panel:#111823; --panel2:#0e141d; --border:#1e2732; --border2:#283544;
    --ink:#e9eef3; --ink2:#9aa7b4; --muted:#5d6b78;
    --teal:#5eead4; --gold:#d9ad3c; --green:#37d39a; --amber:#e0983a; --blue:#5aa2ea; --red:#e46a6a;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.45}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  header{display:flex;align-items:center;justify-content:space-between;padding:16px 26px;border-bottom:1px solid var(--border)}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#2bb39a,#1c8f7c);display:flex;align-items:center;justify-content:center;color:#04231d;font-weight:800;font-size:16px}
  .brand h1{font-size:15px;letter-spacing:.16em;margin:0;font-weight:700}
  .tag{font-size:10px;letter-spacing:.14em;color:var(--muted);border:1px solid var(--border2);border-radius:4px;padding:2px 6px;margin-left:4px}
  .hright{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink2)}
  .btn{border:1px solid var(--border2);background:transparent;color:var(--ink2);border-radius:7px;padding:6px 12px;font-size:13px;cursor:pointer}
  .btn.go{color:var(--teal);border-color:#1f4a44}
  input.k{background:#0c1219;border:1px solid var(--border2);color:var(--ink);border-radius:7px;padding:6px 10px;font-size:12px;width:230px}
  .cfg{display:flex;align-items:center;gap:10px;padding:10px 26px;border-bottom:1px solid var(--border);background:var(--panel2);font-size:12px;color:var(--ink2);flex-wrap:wrap}
  .cfg .status{margin-left:auto;font-size:11.5px}
  .cfg .status.live{color:var(--green)} .cfg .status.demo{color:var(--gold)} .cfg .status.err{color:var(--red)}
  .tabs{display:flex;gap:2px;padding:0 26px;border-bottom:1px solid var(--border);background:var(--panel2)}
  .tab{padding:13px 20px;font-size:13px;letter-spacing:.06em;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;position:relative;top:1px}
  .tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:7px;vertical-align:middle}
  .tab.active{color:var(--ink);border-bottom-color:var(--gold)} .tab.active .dot{background:var(--green);box-shadow:0 0 8px var(--green)}
  .tab.soon{color:var(--muted);cursor:default}
  .tab.soon .lbl-soon{font-size:9px;letter-spacing:.12em;border:1px solid var(--border2);border-radius:4px;padding:1px 5px;margin-left:6px;color:var(--muted)}
  main{max-width:1080px;margin:0 auto;padding:26px}
  .view{display:none} .view.active{display:block}
  .sec-label{font-size:11px;letter-spacing:.16em;color:var(--muted);margin:26px 2px 12px;text-transform:uppercase}
  .sec-label:first-child{margin-top:4px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px} .pad{padding:20px 22px}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .tiles.five{grid-template-columns:repeat(5,1fr)}
  .tile{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px}
  .tile .k{font-size:10.5px;letter-spacing:.13em;color:var(--muted);text-transform:uppercase}
  .tile .v{font-size:34px;font-weight:700;margin:6px 0 2px;color:var(--teal)} .tile .v.gold{color:var(--gold)} .tile .v.green{color:var(--green)} .tile .v.ink{color:var(--ink)}
  .tile .s{font-size:12px;color:var(--ink2)} .tile .s b{color:var(--ink2)}
  .velo .live{font-size:11px;letter-spacing:.13em;color:var(--ink2)} .velo .live b{color:var(--green)}
  .velo .row{display:flex;gap:46px;align-items:flex-end;margin:14px 0}
  .velo .n{font-size:38px;font-weight:700;color:var(--teal)} .velo .n small{display:block;font-size:12px;color:var(--ink2);font-weight:400;margin-top:2px}
  .obs-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .obs{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:15px 16px;display:flex;flex-direction:column;gap:9px}
  .obs .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .obs .id{font-size:12px;letter-spacing:.08em;color:var(--ink2);font-weight:700} .obs .title{font-size:13.5px;margin-top:3px}
  .pill{font-size:9.5px;letter-spacing:.1em;padding:3px 8px;border-radius:20px;text-transform:uppercase;white-space:nowrap;font-weight:700}
  .pill.watch{color:var(--amber);background:rgba(224,152,58,.12);border:1px solid rgba(224,152,58,.35)}
  .pill.candidate{color:var(--teal);background:rgba(94,234,212,.10);border:1px solid rgba(94,234,212,.32)}
  .pill.promoted{color:var(--green);background:rgba(55,211,154,.12);border:1px solid rgba(55,211,154,.35)}
  .obs .meta{display:flex;align-items:center;gap:12px;font-size:11px;color:var(--muted);flex-wrap:wrap}
  .pips{display:inline-flex;gap:3px} .pip{width:9px;height:9px;border-radius:2px;background:#22303c} .pip.real{background:var(--teal)} .pip.self{background:var(--muted)}
  .axis{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--border2);border-radius:4px;padding:2px 6px}
  .obs .note{font-size:11.5px;color:var(--ink2);border-top:1px solid var(--border);padding-top:8px}
  .legend{display:flex;flex-wrap:wrap;gap:16px;font-size:11.5px;color:var(--ink2);margin-top:12px}
  .legend span{display:flex;align-items:center;gap:6px} .sw{width:11px;height:11px;border-radius:3px;display:inline-block}
  .cap{font-size:12px;color:var(--ink2);margin-top:12px} .cap b{color:var(--ink)}
  .feed .frow{display:grid;grid-template-columns:78px 96px 120px 1fr;gap:14px;padding:11px 4px;border-top:1px solid var(--border);font-size:12.5px;align-items:baseline}

  .sessions .srow{display:grid;grid-template-columns:1fr 90px 96px 74px;gap:12px;padding:11px 4px;border-top:1px solid var(--border);font-size:12.5px;align-items:center}

  .auth-error{font-size:13px;color:var(--red);text-align:center;display:none}

// ============================ FETCH ==========================================
async function apiGet(path){
  const base=document.getElementById('api').value.replace(/\/$/,'');
  const key=document.getElementById('key').value.trim();
  const res=await fetch(base+path,{headers:{'x-admin-key':key}});
  if(!res.ok){const t=await res.text();throw new Error('HTTP '+res.status+': '+t.slice(0,200));}
  return res.json();
}
async function loadAll(){
  const st=document.getElementById('status');
  const key=document.getElementById('key').value.trim();
  if(!key){ renderAll(DEMO); st.className='status demo'; st.textContent='— demo data (enter admin key + Load for live) —'; return; }
  st.className='status'; st.textContent='loading…';
  try{
    const [usage,intelligence,cohort]=await Promise.all([
      apiGet('/admin/dashboard/usage'),
      apiGet('/admin/dashboard/intelligence'),
      apiGet('/admin/dashboard/cohort').catch(()=>DEMO.cohort)
    ]);
    renderAll({usage,intelligence,cohort});
    st.className='status live'; st.textContent='● live';
  }catch(e){
    renderAll(DEMO);
    st.className='status err'; st.textContent='live fetch failed — showing demo · '+e.message;
  }
}

function daysSince(iso){ if(!iso) return null; const d=(Date.parse('2026-08-18')-Date.parse(iso))/864e5; return d; }

function renderAll(d){ renderUsage(d.usage); renderIntel(d.intelligence); renderCohort(d.cohort); }

function obsCard(o){
  const pips=[]; for(let i=0;i<o.real_user_recurrence;i++)pips.push('<i class="pip real"></i>'); for(let i=0;i<o.self_test_count;i++)pips.push('<i class="pip self"></i>');
  const wt=[]; if(o.real_user_recurrence)wt.push(o.real_user_recurrence+' real-user'); if(o.self_test_count)wt.push(o.self_test_count+' self-test'); if(o.counter_instances)wt.push(o.counter_instances+' counter');
  return `<div class="obs"><div class="top"><div><div class="id">${esc(o.id)}</div><div class="title">${esc(o.title)}</div></div>
    <span class="pill ${esc(o.status)}">${esc(o.status)}</span></div>
    <div class="meta"><span class="axis">${esc((o.axis||'').replace(/_/g,' '))}</span>
      <span>rec <span class="pips">${pips.join('')||'<i class="pip"></i>'}</span></span>
      <span>${wt.join(' · ')||'—'}</span><span>· seen ${fmtDate(o.first_seen)}</span></div>
    <div class="note">${esc(o.disposition||'')}</div></div>`;
}
function returnsSvg(returns){
  const W=1000,x0=120,x1=970;
  const times=returns.map(r=>Date.parse(r.occurred_at));
  const min=Math.min(...times),max=Math.max(...times),span=(max-min)||1;
  const X=t=>x0+((t-min)/span)*(x1-x0);
  let dots=returns.map((r,i)=>{
    const x=X(Date.parse(r.occurred_at)),y=92,c=SHADE[r.confound_shade]||'#9aa7b4',dy=140+((i%3)*34);
    return `<line x1="${x}" y1="84" x2="${x}" y2="${dy}" stroke="#22303c"/>
      <circle cx="${x}" cy="${y}" r="8" fill="${c}"/>
      <text x="${x}" y="${dy+14}" fill="#e9eef3" font-size="10.5" text-anchor="middle" font-weight="700">${esc(r.id)}</text>
      <text x="${x}" y="${dy+27}" fill="#9aa7b4" font-size="9.5" text-anchor="middle">${esc(r.builder.split(' ')[0])}</text>
      <text x="${x}" y="${dy+39}" fill="#5d6b78" font-size="9" text-anchor="middle">${SHADE_LABEL[r.confound_shade]||''}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} 250" width="100%" role="img" aria-label="Return events timeline; cold-pull lane empty (0).">
    <text x="0" y="30" fill="#d9ad3c" font-size="12" font-family="monospace" font-weight="700">COLD-PULL</text>
    <text x="0" y="45" fill="#5d6b78" font-size="10">the goal · 0</text>
    <rect x="120" y="14" width="850" height="34" rx="8" fill="none" stroke="#d9ad3c" stroke-opacity="0.5" stroke-dasharray="5 5"/>
    <text x="545" y="36" fill="#7d6a2a" font-size="11.5" text-anchor="middle" font-style="italic">empty — no un-nudged, un-seeded return yet</text>
    <line x1="120" y1="92" x2="970" y2="92" stroke="#283544"/>${dots}</svg>`;
}
function ventureMapSvg(vm){
  if(!vm||!vm.length) return '<div class="cap">No cross-thread fragmentation detected.</div>';
  const v=vm[0], th=v.threads||[];
  const cx=500, positions=th.map((_,i)=> th.length===1?cx : 165+i*(670/(th.length-1)));
  let threadBoxes=th.map((t,i)=>{
    const x=positions[i]-165, col=t.relation==='answers'?'#37d39a':(t.relation==='circles'?'#5aa2ea':'#9aa7b4');
    return `<rect x="${x}" y="238" width="330" height="80" rx="10" fill="#111823" stroke="#283544"/>
      <text x="${x+20}" y="262" fill="#e9eef3" font-size="12.5" font-weight="700">${esc(t.label)}</text>
      <text x="${x+20}" y="279" fill="#9aa7b4" font-size="10.5">${esc(t.relation)} · ${esc((t.session_id||'').slice(0,8))}</text>
      <text x="${x+20}" y="299" fill="${col}" font-size="10.5">${esc((t.note||'').slice(0,52))}</text>
      <line x1="${positions[i]}" y1="238" x2="${cx}" y2="196" stroke="#3a4655"/>`;
  }).join('');
  const gap = th.length>1?`<line x1="${positions[0]+165}" y1="278" x2="${positions[1]-165}" y2="278" stroke="#e46a6a" stroke-width="2" stroke-dasharray="6 6"/>
      <rect x="${cx-64}" y="266" width="128" height="24" rx="6" fill="#0a0e13"/>
      <text x="${cx}" y="282" fill="#e46a6a" font-size="10.5" text-anchor="middle" font-weight="700">no memory bridge</text>`:'';
  return `<svg viewBox="0 0 1000 340" width="100%" role="img" aria-label="Venture map: two threads, one shared question, no memory bridge.">
    <rect x="360" y="20" width="280" height="58" rx="10" fill="#141c26" stroke="#5eead4" stroke-opacity="0.55"/>
    <text x="500" y="42" fill="#5eead4" font-size="12.5" text-anchor="middle" font-weight="700">The prior question</text>
    <text x="500" y="62" fill="#c5d0da" font-size="10.5" text-anchor="middle">${esc(v.question.slice(0,58))}</text>
    <rect x="410" y="150" width="180" height="46" rx="10" fill="#1a130a" stroke="#d9ad3c" stroke-opacity="0.6"/>
    <text x="500" y="170" fill="#d9ad3c" font-size="12" text-anchor="middle" font-weight="700">${esc(v.venture.slice(0,22))}</text>
    <text x="500" y="185" fill="#8a7a55" font-size="10" text-anchor="middle">venture</text>
    <line x1="500" y1="78" x2="500" y2="150" stroke="#2f5a48"/>${threadBoxes}${gap}</svg>
    <div class="cap">Two threads of one venture circling the same question, with no bridge between them — the case for V3 cross-thread memory. Derived, not drawn by hand.</div>`;
}
function renderCohort(c){

    <div class="privacy-banner">🔒 <span><b>Privacy wall.</b> ${esc(c.privacy||'Leader sees engagement, emergence, and progress only — never the raw session.')}</span></div>
    <div class="card pad cohort">
      <div class="mrow h"><span>Builder</span><span>Status</span><span>Engagement</span><span>Emergence &amp; progress</span></div>
      ${rows}
    </div>
    <div class="footer-note">This is the exact view a program operator (Bobby, a professor, a studio) would get — proven here on your panel. If it's useful to you watching these six, it's useful at 80. The privacy wall is the feature that makes it trustworthy to the builders <b>and</b> the leader.</div>`;
}
const sigLabel=s=>({un_nudged_work_return:'un-nudged work return',deep_repeated_use:'deep repeated use',acted_on_prior_question:'acted on prior question',refers_others:'refers others ★'}[s]||s);
function fmtDate(s){ if(!s) return '—'; const d=new Date(s); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function fmtAgo(s){ if(!s) return '—'; const d=(Date.parse('2026-08-18')-Date.parse(s))/864e5; if(d<1)return 'today'; if(d<2)return '1d ago'; if(d<30)return Math.round(d)+'d ago'; return fmtDate(s); }

const SUPABASE_URL = 'https://vxwsldczrpvjkivepnlb.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable__PjjxzUjbyfev4TDEQ0Z3A_XTeBOnBX';

async function signInWithGoogle(){
  const { error } = await sb.auth.signInWithOAuth({
    provider:'google',
    options:{ redirectTo: window.location.href.split('?')[0].split('#')[0] }
  });
  if(error) console.error('Sign in error:', error);

async function signOut(){
  await sb.auth.signOut();
  document.getElementById('dashboard').style.display='none';
  document.getElementById('auth-gate').style.display='flex';
}
async function showDashboard(session){
  const email = session.user?.email;
  if(!email || email !== ADMIN_EMAIL){
    document.getElementById('auth-error').style.display='block';
    document.getElementById('auth-gate').style.display='flex';
    await sb.auth.signOut();
    return;
  }
  document.getElementById('auth-gate').style.display='none';
  document.getElementById('dashboard').style.display='block';
  document.getElementById('whoami').textContent=email;
  loadAll(); // renders demo until an admin key is entered
}
sb.auth.onAuthStateChange(async (event, session)=>{
  if(session){ await showDashboard(session); }
  else{
    document.getElementById('dashboard').style.display='none';
    document.getElementById('auth-gate').style.display='flex';
  }
});
(async ()=>{
  const { data } = await sb.auth.getSession();
  if(data.session){ await showDashboard(data.session); }
