<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winntelligence | From Inception to Scale</title>
    <style>
        body {
            background-color: #050a14; /* Deep Winntelligence Blue */
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 600px; text-align: center; }
        
        /* THE LOGO SYMBOL */
        .symbol { 
            font-size: 3.5rem; 
            margin-bottom: 25px; 
            color: #3b82f6;
            filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.3));
        }

        h1 { font-weight: 300; letter-spacing: -1px; font-size: 2.8rem; margin-bottom: 15px; }
        p { color: #94a3b8; line-height: 1.6; font-size: 1.15rem; margin-bottom: 40px; }
        
        /* THE INTERROGATOR */
        form { width: 100%; text-align: left; }
        label { font-size: 0.8rem; color: #475569; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: block; }
        textarea {
            width: 100%;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 8px;
            color: white;
            padding: 18px;
            font-size: 1rem;
            height: 150px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }
        textarea:focus { border-color: #3b82f6; }
        
        button {
            margin-top: 20px;
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            letter-spacing: 1px;
        }
        button:hover { background-color: #3b82f6; }

        footer { 
            margin-top: 80px; 
            font-size: 0.7rem; 
            color: #334155; 
            letter-spacing: 3px; 
            text-transform: uppercase; 
            border-top: 1px solid #1e293b;
            padding-top: 20px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="symbol">◈</div>

        <h1>From Inception to Scale.</h1>
        <p>Building winning ventures requires navigation, not just maps. Winntelligence provides the agentic infrastructure to de-blur intent and operationalize venture physics.</p>

        <form action="mailto:winn@winntelligence.ai" method="POST" enctype="text/plain">
            <label>The Initial Inquiry</label>
            <textarea name="The_Blur" placeholder="Describe the current blur in your venture..." required></textarea>
            <button type="submit">DE-BLUR WITH WINN</button>
        </form>

        <footer>
            Winn-Alpha &nbsp; // &nbsp; Winn-Matrix &nbsp; // &nbsp; Winn-Forge
        </footer>
    </div>

</body>
</html>
