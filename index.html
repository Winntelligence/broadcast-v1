<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winntelligence // From Inception to Scale</title>
    <style>
        body {
            background-color: #020202; /* Minsky-approved deep obsidian */
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        .main-logo {
            width: 650px; /* Increased for authority */
            max-width: 95%; /* Keeps it safe on mobile */
            height: auto;
            margin-bottom: 10px;
            /* If logo has a gray background, this helps it blend: */
            mix-blend-mode: screen; 
        }

        h1 {
            font-size: 32px;
            font-weight: 400;
            letter-spacing: 1px;
            margin: 50px 0 15px 0;
            color: #ffffff;
        }

        .hero-hook {
            font-size: 18px;
            color: #94a3b8;
            margin-bottom: 45px;
            font-weight: 300;
        }

        label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            color: #64748b;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 15px;
            color: #f8fafc;
            font-size: 16px;
            margin-bottom: 20px;
            resize: none;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: #3b82f6;
        }

        button {
            width: 100%;
            background-color: #004aad;
            color: white;
            border: none;
            padding: 18px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #0056cc;
            transform: translateY(-1px);
        }

        footer {
            margin-top: 60px;
            font-size: 11px;
            letter-spacing: 3px;
            color: #334155;
            text-transform: uppercase;
        }

        hr {
            border: 0;
            border-top: 1px solid #1e293b;
            margin-top: 40px;
            width: 50%;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-header">
        <img class="main-logo" src="logo.png" alt="Winntelligence Logo">
    </div>

    <h1>From Inception to Scale.</h1>
    
    <p class="hero-hook">Build your vision with our venture coaching.</p>

    <form action="https://formspree.io/f/xwvyzglp" method="POST">
    <label>What are you building?</label>
    
    <textarea id="venture-input" name="Venture_Vision" placeholder="“We’re building [X] for [Y] by doing [Z]...”" required></textarea>
    
    <button type="submit" onclick="handleBuild()">LET'S BUILD</button>
</form>

    <hr>

    <footer>
        Winn-Alpha // Winn-Matrix // Winn-Forge
    </footer>
</div>
</div> 
    <script>
        function handleBuild() {
            const textarea = document.getElementById('venture-input');
            const button = document.querySelector('.cta-button');
            const originalText = button.innerText;

            setTimeout(() => {
                button.innerText = "BRIEF REQUESTED ✓";
                button.style.backgroundColor = "#28a745"; 
                if(textarea) textarea.value = ""; 
            }, 500);

            setTimeout(() => {
                button.innerText = originalText;
                button.style.backgroundColor = ""; 
            }, 5000);
        }
    </script>

</body>
</html>
</body>
</html>
