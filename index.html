<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winntelligence // From Inception to Scale</title>
    <style>
        body {
            background-color: #020202; /* Minsky-approved deep obsidian */
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        .main-logo {
            width: 650px; /* Increased for authority */
            max-width: 95%; /* Keeps it safe on mobile */
            height: auto;
            margin-bottom: 10px;
            /* If logo has a gray background, this helps it blend: */
            mix-blend-mode: screen; 
        }

        h1 {
            font-size: 32px;
            font-weight: 400;
            letter-spacing: 1px;
            margin: 50px 0 15px 0;
            color: #ffffff;
        }

        .hero-hook {
            font-size: 18px;
            color: #94a3b8;
            margin-bottom: 45px;
            font-weight: 300;
        }

        label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            color: #64748b;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 15px;
            color: #f8fafc;
            font-size: 16px;
            margin-bottom: 20px;
            resize: none;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: #3b82f6;
        }

        button {
            width: 100%;
            background-color: #004aad;
            color: white;
            border: none;
            padding: 18px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #0056cc;
            transform: translateY(-1px);
        }

        footer {
            margin-top: 60px;
            font-size: 11px;
            letter-spacing: 3px;
            color: #334155;
            text-transform: uppercase;
        }

        hr {
            border: 0;
            border-top: 1px solid #1e293b;
            margin-top: 40px;
            width: 50%;
        }
    </style>
    <link rel="stylesheet" href="assets/css/main.css" />
    <noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="7c354570-eb5d-4f9a-9611-9fc49cff630c"></script>
</head>
<body>

<div class="container">
    <div class="brand-header">
        <img class="main-logo" src="logo.png" alt="Winntelligence Logo">
    </div>

    <h1>From Inception to Scale.</h1>
    
    <p class="hero-hook">Build your vision with our venture coaching.</p>

    <form id="inception-form" action="https://formgrid.dev/api/f/5enndib3" method="POST">
    <input type="hidden" name="subject" value="NEW VENTURE INCEPTION BRIEF">
    <label>What are you building?</label>

    <textarea id="venture-input" name="Founder Vision" placeholder="“We’re building [X] for [Y] by doing [Z]...”" required></textarea>
    
    <button type="submit" >LET'S BUILD</button>
</form>

    <hr>

    <footer>
        Winn-Alpha // Winn-Matrix // Winn-Forge
    </footer>
</div>
</div> 
    <script>
    async function handleBuild(event) {
        // 1. Prevents the page from reloading/redirecting
        if (event) event.preventDefault();

        const input = document.getElementById('venture-input');
        const button = document.querySelector('button');
        const form = document.getElementById('inception-form');

        // Check if there is actually text in the box
        if (!input.value.trim()) {
            alert("Please describe your vision first.");
            return;
        }

        // 2. Immediate Visual Feedback (Institutional Precision)
        button.textContent = "BRIEF RECEIVED";
        button.style.backgroundColor = "#28a745"; // Success Green

        // 3. The "Silent" Handshake (Sending data to Formspree in background)
        const data = new FormData(form);
        try {
            await fetch(form.action, {
                method: form.method,
                body: data,
                headers: { 'Accept': 'application/json' }
            });

            // 4. The Resolution: Clear the box now that data is safe
            input.value = "";
        } catch (error) {
            console.error("Submission failed", error);
            button.textContent = "SYSTEM ERROR";
            button.style.backgroundColor = "#dc3545";
        }

        // 5. Reset button back to original state after 3 seconds
        setTimeout(() => {
            button.textContent = "LET'S BUILD";
            button.style.backgroundColor = "#0056b3";
        }, 3000);
    }
</script>

</body>
</html>
